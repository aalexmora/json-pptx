# Шаблон-«конструктор» может содержать три типа слайдов:
# Product, Stream и Roadmap/Tier. Тип задаётся служебным шейпом-маркером.
# Без маркеров сохраняется legacy-режим: один Roadmap-слайд.
# Builder клонирует колонку под каждый квартал (1–N), поэтому поддерживает всю
# вариативность (1/2/3/4+ колонок, переполнение, пагинацию) без доп. шаблонов.
#
# Конвенция имён (обязательные):
#   col_header   — заголовок квартала («Q1 2025») — прототип колонки
#   col_bullets  — список фич (заголовки групп — жирные абзацы внутри)
#
# Необязательные:
#   eyebrow      — «Roadmap» / «Roadmap (cont.)» (легаси, заменён на roadmap)
#   slide_title  — название тира
#   Product_Name — название продукта
#   roadmap_label                  — статичный ярлык «Roadmap»
#   product_logo                   — legacy-алиас фона Product-слайда
#   tier_logo                      — логотип тира
#   product_slide_image            — PNG-фон Product-слайда-заглушки
#   quarter_marker                 — декоративная точка квартала
#   subject_to_change_footnote     — единая сноска Subject to Change
#   tier_inheritance_note          — legacy-плейсхолдер; всегда очищается
#   slide_number                   — порядковый номер слайда
#   roadmap_year                   — текущий системный год (YYYY)
#   roadmap_version                — текущая системная дата (Version DD.MM.YY)
#   col_separator_1..3 — вертикальные разделители адаптивной сетки; существующие
#                        линии шаблона нужно переименовать в эти имена
#
# Префикс «_» в начале имени шейпа = сервисный/направляющий (не попадает в слайд),
# НО если имя после «_» совпадает с плейсхолдером выше (например «_roadmap») —
# шейп копируется и обрабатывается билдером.

roadmap:
  base: [col_header, col_bullets]
  optional: [eyebrow, slide_title, col_group_header]
  slide_types:
    product:
      markers: [_slide_type_product]
      required_roles: [product_name]
    stream:
      markers: [_slide_type_stream]
      required_roles: [stream_name]
    roadmap:
      markers: [_slide_type_roadmap]
      required_shapes: [col_header, col_bullets]
  roles:
    roadmap_label: [roadmap_label, roadmap]
    product_name: [Product_Name, product_name]
    stream_name: [Stream_Name, stream_name]
    quarter_marker: [quarter_marker, dot]
    product_logo: [product_logo, logo]
    product_slide_image: [product_slide_image, product_slide_logo]
    tier_logo: [tier_logo, logo_tier]
    slide_number: [slide_number, number]
    roadmap_year: [roadmap_year]
    roadmap_version: [roadmap_version]
    subject_to_change_footnote: [subject_to_change_footnote, s2c]
    tier_inheritance_note: [tier_inheritance_note, inheritance_note]
  layout:
    separators: [col_separator_1, col_separator_2, col_separator_3]
