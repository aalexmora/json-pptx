# Состав обязательных именованных шейпов на комбинацию
# `slide_type × columns_count × grouped_by_apptitle` (и для аннотаций).
#
# Это ЕДИНСТВЕННОЕ место, где описан состав шейпов — template_registry.py читает
# его отсюда, а не хардкодит имена в коде (ТЗ v4 раздел 10). Изменение состава
# слотов (в т.ч. при появлении финального дизайн-шаблона) — правка только этого
# файла, без правок .py.
#
# Конвенция имён (ТЗ v4 раздел 12):
#   col_{n}_header          — заголовок n-й колонки-квартала (n = 1..4)
#   col_{n}_bullets         — список bullet'ов n-й колонки
#   col_{n}_group_{m}_header — подзаголовок AppTitle-группы m внутри колонки n
#   annotation_*            — placeholder-шейпы аннотаций

roadmap:
  columns_1_flat: [col_1_header, col_1_bullets]
  columns_1_grouped: [col_1_header, col_1_bullets, col_1_group_1_header]
  columns_2_flat: [col_1_header, col_1_bullets, col_2_header, col_2_bullets]
  columns_2_grouped:
    [col_1_header, col_1_bullets, col_1_group_1_header, col_2_header, col_2_bullets, col_2_group_1_header]
  columns_3_flat:
    [col_1_header, col_1_bullets, col_2_header, col_2_bullets, col_3_header, col_3_bullets]
  columns_3_grouped:
    [
      col_1_header, col_1_bullets, col_1_group_1_header,
      col_2_header, col_2_bullets, col_2_group_1_header,
      col_3_header, col_3_bullets, col_3_group_1_header,
    ]
  columns_4_flat:
    [
      col_1_header, col_1_bullets, col_2_header, col_2_bullets,
      col_3_header, col_3_bullets, col_4_header, col_4_bullets,
    ]
  columns_4_grouped:
    [
      col_1_header, col_1_bullets, col_1_group_1_header,
      col_2_header, col_2_bullets, col_2_group_1_header,
      col_3_header, col_3_bullets, col_3_group_1_header,
      col_4_header, col_4_bullets, col_4_group_1_header,
    ]

annotations:
  subject_to_change: [annotation_subject_to_change]
  under_approval: [annotation_under_approval]
  tier_inheritance: [annotation_tier_inheritance]
